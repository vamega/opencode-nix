name: Update OpenCode package

on:
  schedule:
    # Check upstream once per day.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-version-update
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      has_update: ${{ steps.release.outputs.has_update }}
      needs_publish: ${{ steps.release.outputs.needs_publish }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Check upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(sed -n 's/^[[:space:]]*version = "\([^"]*\)";.*/\1/p' package.nix | head -1)
          version=$(./scripts/update-version.sh --latest)
          if [ -z "$version" ]; then
            echo "::error::Could not read the latest OpenCode release"
            exit 1
          fi

          has_update=false
          if [ "$current" != "$version" ]; then
            has_update=true
            ./scripts/update-version.sh --version "$version"
          fi

          needs_publish=$has_update
          if ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            needs_publish=true
          fi

          {
            echo "version=$version"
            echo "has_update=$has_update"
            echo "needs_publish=$needs_publish"
          } >> "$GITHUB_OUTPUT"
          echo "Current: $current; upstream: $version; update: $has_update; publish: $needs_publish"

      - name: Upload updated package definitions
        if: steps.release.outputs.has_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-package-definitions
          path: |
            package.nix
            package-desktop.nix
          if-no-files-found: error

  validate:
    needs: prepare
    if: needs.prepare.outputs.needs_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Download updated package definitions
        if: needs.prepare.outputs.has_update == 'true'
        uses: actions/download-artifact@v4
        with:
          name: updated-package-definitions
          path: .

      - name: Check flake outputs
        run: nix flake check

      - name: Build CLI and desktop packages
        run: nix build .#opencode .#opencode-desktop --no-link

      - name: Verify CLI version
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          output=$(nix run .#opencode -- --version)
          printf '%s\n' "$output"
          echo "$output" | grep -F "$EXPECTED_VERSION"

  publish:
    needs: [prepare, validate]
    if: needs.prepare.outputs.needs_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download updated package definitions
        if: needs.prepare.outputs.has_update == 'true'
        uses: actions/download-artifact@v4
        with:
          name: updated-package-definitions
          path: .

      - name: Publish package version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- package.nix package-desktop.nix; then
            git add package.nix package-desktop.nix
            git commit -m "Update OpenCode to v$VERSION"
            git push origin HEAD:main
          fi

          if ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "OpenCode v$VERSION" \
              --notes "Nix package update for [OpenCode v$VERSION](https://github.com/anomalyco/opencode/releases/tag/v$VERSION). The package downloads the upstream release binaries at build time."
          fi
